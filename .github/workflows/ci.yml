name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_generator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_generator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/content_generator
      GEMINI_API_KEY: ci-test-key
      GEMINI_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests app.py serve.py pages scripts
      - name: Unit and non-integration tests
        run: pytest tests -q -m "not integration"
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: PostgreSQL integration tests
        run: pytest tests -q -m integration
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: Dependency check
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t seo-content-generator:ci .
