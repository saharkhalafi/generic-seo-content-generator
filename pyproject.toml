[tool.pytest.ini_options]
markers = [
    "integration: requires DATABASE_URL and live PostgreSQL",
    "regression: compares against saved SEO baseline",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"pages/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
